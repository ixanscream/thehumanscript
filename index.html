<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Deployment Trigger: 2026-04-24-v1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE HUMAN SCRIPT | Ghost Protocol</title>
    <meta name="description" content="Decentralized Human Sovereignty & Algorithmic Poisoning">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanline"></div>
    <div class="noise"></div>
    
    <header class="hero">
        <div class="glitch-container">
            <h1 class="glitch" data-text="THE HUMAN SCRIPT">THE HUMAN SCRIPT</h1>
        </div>
        <p class="subtitle">SYSTEM VERSION 2.3 | THE GHOST PROTOCOL</p>
        <div class="status-bar">
            <span class="status-item"><span class="dot pulse"></span> NETWORK: DECENTRALIZED</span>
            <span class="status-item"><span class="dot"></span> STATUS: ACTIVE</span>
        </div>
    </header>

    <div class="lang-switcher">
        <button id="btn-id" class="lang-btn active">ID</button>
        <button id="btn-en" class="lang-btn">EN</button>
    </div>

    <main id="content-wrapper">
        <section id="readme-content-id" class="glass-card lang-section shadow-glow"></section>
        <section id="readme-content-en" class="glass-card lang-section shadow-glow" style="display:none;"></section>
    </main>

    <footer>
        <p>&copy; 2026 THE ARCHITECTS | <a href="https://github.com/ixanscream/thehumanscript" target="_blank">SECURE REPOSITORY</a></p>
    </footer>

    <script>
        let currentLang = 'id';

        async function loadReadme() {
            try {
                const response = await fetch('README.md');
                const text = await response.text();
                
                // Split content based on markers
                const parts = text.split(/\[ENGLISH_VERSION_START\]|\[ENGLISH_VERSION_END\]/);
                const idContent = parts[0];
                const enContent = parts[1] || "";

                document.getElementById('readme-content-id').innerHTML = marked.parse(idContent);
                document.getElementById('readme-content-en').innerHTML = marked.parse(enContent);

                // Add premium styling to tables
                document.querySelectorAll('table').forEach(t => t.classList.add('premium-table'));
            } catch (error) {
                console.error('Error loading README:', error);
            }
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`readme-content-${lang}`).style.display = 'block';
            document.getElementById(`btn-${lang}`).classList.add('active');
            
            // Add a small glitch effect on switch
            document.querySelector('.hero').classList.add('glitch-active');
            setTimeout(() => document.querySelector('.hero').classList.remove('glitch-active'), 300);
        }

        document.getElementById('btn-id').onclick = () => switchLang('id');
        document.getElementById('btn-en').onclick = () => switchLang('en');

        loadReadme();
    </script>
</body>
</html>
